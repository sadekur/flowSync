events {}

http {
  server_tokens off;
  # 1 MB matches the API's express.json limit.
  client_max_body_size 1m;

  # Upgrade only when the client asked for it (Socket.IO's WebSocket).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream web { server web:3000; }
  upstream api { server api:4000; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Defense in depth: repeated here for every response, including the Next.js
    # pages that helmet (API only) never sees. No script-src CSP for the pages:
    # Next.js App Router hydrates with inline scripts, so 'self' alone would
    # break it — that needs nonces via proxy.ts (see DECISIONS.md, Step 13).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The backend's same-origin socket check compares Origin with this.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
      proxy_pass http://api;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Idle sockets stay open between Socket.IO pings (25 s by default).
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
