# Self-hosted FlowSync: Nginx (TLS + security headers) in front of the Next.js
# frontend and the Express + Socket.IO backend, with MongoDB and Redis.
# Same shape as the Vercel deploy: one public origin, /api and /socket.io
# routed to the backend, everything else to the frontend.
#
#   ./deploy/make-dev-cert.sh            # self-signed cert for https://localhost
#   JWT_ACCESS_SECRET=… JWT_REFRESH_SECRET=… docker compose up --build
#   open https://localhost
#
# Secrets come from the shell (or a .env next to this file, which Compose
# reads for ${…} interpolation). Mongo and Redis are only on the internal
# network; nothing but Nginx publishes a port.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build: .
    restart: unless-stopped
    command: ["node", "backend/dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/flowsync
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (openssl rand -hex 64)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (openssl rand -hex 64)}
      # Same-origin behind Nginx: no CORS_ORIGIN, host-only cookies.
    depends_on:
      - mongo
      - redis

  web:
    build: .
    restart: unless-stopped
    command: ["node_modules/.bin/next", "start", "-p", "3000"]
    environment:
      NODE_ENV: production
      # Server Components call the API directly on the compose network.
      BACKEND_INTERNAL_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

volumes:
  mongo-data:
  redis-data:
